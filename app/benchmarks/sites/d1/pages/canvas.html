<!doctype html><html lang="en"><head><meta charset="utf-8"><title>D1 Canvas</title></head><body style="margin:0">
<canvas id="c" width="400" height="200" style="display:block"></canvas><p id="hit">none</p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const shapes = [{n: 'red square', x: 40, y: 60, w: 60, h: 60, col: '#d22'},
                {n: 'blue star', x: 170, y: 60, w: 60, h: 60, col: '#22d'},
                {n: 'green circle', x: 300, y: 60, w: 60, h: 60, col: '#2a2'}];
shapes.forEach(s => { g.fillStyle = s.col; g.fillRect(s.x, s.y, s.w, s.h); });
c.addEventListener('click', e => {
  const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const s = shapes.find(s => x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h);
  document.getElementById('hit').textContent = s ? s.n : 'miss';
});
</script></body></html>
