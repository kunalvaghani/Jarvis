<!doctype html><html lang="en"><head><meta charset="utf-8"><title>D1 Modal</title></head><body>
<h1>Modal</h1><button onclick="document.getElementById('dlg').showModal()">Open dialog</button>
<dialog id="dlg" aria-label="Confirm choice"><p>Proceed?</p>
<button onclick="document.getElementById('dlg').close();document.getElementById('result').textContent='confirmed'">Confirm</button>
<button onclick="document.getElementById('dlg').close();document.getElementById('result').textContent='cancelled'">Cancel</button></dialog>
<p id="result">none</p>
</body></html>
