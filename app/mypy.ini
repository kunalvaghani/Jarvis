# Strict typing gate for the control layer only (docs/rework/PROGRESS.md, Phase 1).
# Legacy Jarvis modules are untyped; they are imported, not checked.
[mypy]
python_version = 3.10
files = jarvis/control, jarvis/flags.py, jarvis/telemetry, jarvis/learning
strict = True
warn_unreachable = True

[mypy-jarvis.*]
follow_imports = skip

[mypy-jarvis.control.*]
follow_imports = normal

[mypy-jarvis.flags]
follow_imports = normal

[mypy-jarvis.telemetry.*]
follow_imports = normal

[mypy-jarvis.learning.*]
follow_imports = normal

[mypy-comtypes.*]
ignore_missing_imports = True
